<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | After Party Mu Pool Party</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span>After</span> <b>Party</b><small>Mu Pool Party</small></a><nav><a href="index.html">Home</a><a href="index.html#ticket">Buy Ticket</a></nav><a class="admin-link" id="logout">Logout</a></header><main class="section"><div class="glass panel" id="accountBox"><h1>👤 My Account</h1><div id="profile"></div><h2>🎟 My Tickets</h2><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Payment Ref</th><th>Status</th><th>QR</th></tr></thead><tbody id="myTickets"></tbody></table></div></div></main><script>const t=localStorage.getItem('apm_user_token');if(!t)location.href='login.html';const h={'Authorization':'Bearer '+t};fetch('/api/me',{headers:h}).then(r=>r.json()).then(u=>profile.innerHTML=`<p><b>${u.name}</b><br>${u.email}<br>${u.phone}</p>`);fetch('/api/my-tickets',{headers:h}).then(r=>r.json()).then(rows=>myTickets.innerHTML=rows.map(x=>`<tr><td><b>${x.ticket_no}</b></td><td>${x.payment_ref}</td><td>${x.status}</td><td><a class="btn ghost" href="/api/ticket/${x.ticket_no}/qr" target="_blank">QR</a></td></tr>`).join('')||'<tr><td colspan="4">No tickets yet.</td></tr>');logout.onclick=()=>{localStorage.removeItem('apm_user_token');location.href='index.html'};</script></body></html>
