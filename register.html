<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | After Party Mu Pool Party</title><link rel="stylesheet" href="style.css"></head><body><div class="login-wrap"><form id="form" class="glass login-card"><div class="brand big"><span>After</span> <b>Party</b><small>Mu Pool Party</small></div><h2>📝 Create Account</h2><input id="name" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Phone number" required><input id="password" type="password" minlength="6" placeholder="Password (6+ characters)" required><button class="btn primary">Create Account</button><div id="err" class="error"></div><p>Already have an account? <a href="login.html">Login</a></p></form></div><script>form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,phone:phone.value,password:password.value})});const j=await r.json();if(!r.ok)return err.textContent=j.error;localStorage.setItem('apm_user_token',j.token);location.href='account.html'}</script></body></html>
