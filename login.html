<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | After Party Mu Pool Party</title><link rel="stylesheet" href="style.css"></head><body><div class="login-wrap"><form id="form" class="glass login-card"><div class="brand big"><span>After</span> <b>Party</b><small>Mu Pool Party</small></div><h2>👤 User Login</h2><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn primary">Login</button><div id="err" class="error"></div><p>Don't have an account? <a href="register.html">Create one</a></p></form></div><script>form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/user/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok)return err.textContent=j.error;localStorage.setItem('apm_user_token',j.token);location.href='account.html'}</script></body></html>
